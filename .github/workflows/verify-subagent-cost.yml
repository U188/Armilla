name: Verify Sub-agent Cost Optimization

# 仅用于验证「子代理成本优化」这一批改动的编译与单元测试。
# 不依赖仓库 Secrets（现有 build-debug.yml 需要发布签名密钥，fork 上没有）。
on:
  push:
    branches:
      - "feat/sub-agent-cost-optimization"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-subagent-cost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: 编译与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$(find "$sdkroot/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "::error::未找到 sdkmanager"
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --channel=3 "platforms;android-37.0" || true

      - name: 运行单元测试
        timeout-minutes: 40
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:testDebugUnitTest

      - name: 上传单测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
